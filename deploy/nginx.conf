server {
    listen 80 default_server;
    server_name 101.245.99.58 mrzhang291.com www.mrzhang291.com;

    location /.well-known/acme-challenge/ { root /var/www/acme; }

    client_max_body_size 50m;

    # ---- 管理后台（挂在 /console/ 前缀下，反向代理到 5001）----
    location /console/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /console/$1;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # ---- 短路径：/admin 直接跳后台 ----
    location = /admin {
        return 302 /console/admin/login;
    }

    location = /admin/ {
        return 302 /console/admin/login;
    }

    location /static/ {
        alias /opt/breast-cancer-detection/static/;
        expires 7d;
        access_log off;
    }

    location /api/agent/run {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
