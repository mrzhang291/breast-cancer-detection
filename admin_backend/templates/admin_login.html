<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link rel="stylesheet" href="/console/static/vendor/fa6/all.min.css">
    <link rel="stylesheet" href="/console/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid fa-shield-halved"></i> 管理员登录</h2>
            <p class="login-sub">乳腺癌检测系统 · ADMIN CONSOLE</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> 登录
                </button>
            </form>
            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = (location.pathname.indexOf('/console') === 0 ? '/console' : '') + '/api';

        async function login(username, password) {
            const response = await fetch(`${API_BASE_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            });
            return await response.json();
        }

        function setToken(newToken) {
            try {
                localStorage.setItem('token', newToken);
            } catch (e) {
                sessionStorage.setItem('token', newToken);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const result = await login(username, password);
                
                if (result.code === 200) {
                    setToken(result.data.token);
                    window.location.href = '/console/admin';
                } else {
                    document.getElementById('errorAlert').textContent = result.message || '登录失败';
                    document.getElementById('errorAlert').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('errorAlert').textContent = '登录失败: ' + e.message;
                document.getElementById('errorAlert').style.display = 'block';
            }
        });
    </script>
</body>
</html>
