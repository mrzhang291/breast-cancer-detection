{# AI 助手侧栏：在 home / result / records 页面 include 使用。
   页面可通过 window.AGENT_CONTEXT 注入上下文：
   {recordId, values, prediction, confidence, tier, title} #}
<style>
    .as-toggle {
        position: fixed; right: 24px; bottom: 26px; z-index: 60;
        width: 54px; height: 54px; border-radius: 16px; border: 0;
        display: grid; place-items: center; cursor: pointer;
        color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed);
        box-shadow: 0 16px 34px -12px rgba(79, 70, 229, .85);
        transition: transform .18s, box-shadow .18s;
    }
    .as-toggle:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -12px rgba(79,70,229,.95); }
    .as-toggle.hidden { display: none; }

    .as-panel {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 70;
        width: 400px; max-width: 100vw;
        display: flex; flex-direction: column;
        background: #fff; border-left: 1px solid #e6ebf3;
        box-shadow: -18px 0 50px -30px rgba(15, 23, 42, .45);
        transform: translateX(102%);
        transition: transform .28s cubic-bezier(.22,.8,.3,1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                     "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .as-panel.open { transform: none; }

    .as-head {
        display: flex; align-items: center; gap: 11px;
        padding: 16px 16px 14px; border-bottom: 1px solid #eef2f8;
    }
    .as-avatar {
        width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px;
        display: grid; place-items: center; color: #4f46e5; background: #eef2ff;
    }
    .as-name { font-size: 14.5px; font-weight: 700; color: #0f172a; line-height: 1.25; }
    .as-sub { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
    .as-close {
        margin-left: auto; width: 32px; height: 32px; border-radius: 9px;
        border: 0; background: transparent; color: #94a3b8; cursor: pointer;
        font-size: 18px; line-height: 1;
    }
    .as-close:hover { background: #f1f5f9; color: #475569; }

    .as-ctx {
        display: flex; align-items: center; gap: 8px;
        margin: 12px 16px 0; padding: 9px 12px;
        background: #f7f9fd; border: 1px solid #e8eef7; border-radius: 11px;
        font-size: 12px; color: #475569;
    }
    .as-ctx b { color: #0f172a; font-weight: 600; }
    .as-ctx .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex: 0 0 7px; }

    .as-quick { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 16px 4px; }
    .as-chip {
        font-size: 12px; padding: 6px 11px; border-radius: 999px;
        border: 1px solid #e2e8f0; background: #fff; color: #475569;
        cursor: pointer; transition: .16s; font-family: inherit;
    }
    .as-chip:hover { border-color: #c7d2fe; background: #eef2ff; color: #4f46e5; }

    .as-body { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
    .as-body::-webkit-scrollbar { width: 6px; }
    .as-body::-webkit-scrollbar-thumb { background: #dbe3ee; border-radius: 3px; }

    .as-msg { display: flex; gap: 9px; }
    .as-msg.user { justify-content: flex-end; }
    .as-bubble {
        max-width: 88%; padding: 11px 13px; border-radius: 13px;
        font-size: 13px; line-height: 1.72; color: #1e293b;
        background: #f7f9fd; border: 1px solid #eef2f8;
    }
    .as-msg.user .as-bubble {
        background: linear-gradient(135deg, #4f46e5, #6d5ce7); color: #fff; border: 0;
    }
    .as-bubble p { margin: 0 0 8px; }
    .as-bubble p:last-child { margin-bottom: 0; }
    .as-bubble ul { margin: 4px 0 8px; padding-left: 18px; }
    .as-bubble li { margin: 3px 0; }
    .as-bubble strong { font-weight: 700; }

    .as-cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .as-cite {
        font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
        background: #eef2ff; color: #4338ca; border: 1px solid #e0e7ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .as-steps { margin-top: 9px; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
    .as-steps summary {
        cursor: pointer; font-size: 11.5px; color: #64748b; list-style: none;
        display: flex; align-items: center; gap: 6px;
    }
    .as-steps summary::-webkit-details-marker { display: none; }
    .as-steps summary:hover { color: #4f46e5; }
    .as-steps ol { margin: 8px 0 0; padding-left: 16px; }
    .as-steps li { font-size: 11.5px; color: #64748b; margin: 4px 0; line-height: 1.5; }
    .as-steps li b { color: #334155; }

    .as-clarify { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
    .as-clarify button {
        text-align: left; padding: 9px 12px; border-radius: 10px;
        border: 1px solid #e0e7ff; background: #fff; color: #4338ca;
        font-size: 12.5px; cursor: pointer; font-family: inherit; transition: .16s;
    }
    .as-clarify button:hover { background: #eef2ff; }
    .as-retry { margin-top: 8px; }

    .as-foot { border-top: 1px solid #eef2f8; padding: 10px 16px 14px; }
    .as-input-row {
        display: flex; gap: 8px; align-items: flex-end;
        background: #f7f9fd; border: 1.5px solid #e6ebf3; border-radius: 13px;
        padding: 8px 8px 8px 12px; transition: border-color .16s, box-shadow .16s;
    }
    .as-input-row:focus-within { border-color: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .as-input {
        flex: 1; border: 0; background: transparent; resize: none; outline: none;
        font-size: 13px; line-height: 1.6; max-height: 110px; min-height: 24px;
        font-family: inherit; color: #0f172a;
    }
    .as-send {
        width: 34px; height: 34px; flex: 0 0 34px; border: 0; border-radius: 10px;
        display: grid; place-items: center; cursor: pointer; color: #fff;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    .as-send:disabled { opacity: .45; cursor: not-allowed; }
    .as-tools { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #94a3b8; }
    .as-tools button {
        border: 0; background: transparent; color: #94a3b8; cursor: pointer;
        font-size: 11px; font-family: inherit; padding: 2px 4px;
    }
    .as-tools button:hover { color: #4f46e5; }

    .as-dots span {
        display: inline-block; width: 5px; height: 5px; margin-right: 3px;
        border-radius: 50%; background: #a5b4fc; animation: as-bounce 1s infinite;
    }
    .as-dots span:nth-child(2) { animation-delay: .15s; }
    .as-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes as-bounce { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-4px); opacity: 1; } }



    .as-timeline { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 8px; }
    .as-tl-item {
        display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #64748b;
    }
    .as-tl-dot {
        width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; flex: 0 0 8px;
        transition: background .2s;
    }
    .as-tl-item.running .as-tl-dot { background: #6366f1; animation: as-pulse 1s infinite; }
    .as-tl-item.done .as-tl-dot { background: #10b981; }
    .as-tl-item.fail .as-tl-dot { background: #ef4444; }
    .as-tl-label { color: #334155; font-weight: 600; }
    .as-tl-sub { padding-left: 16px; font-size: 11px; opacity: .85; }
    .as-tl-meta { color: #94a3b8; }
    .as-cursor::after {
        content: '▍'; color: #6366f1; animation: as-blink 1s steps(1) infinite;
        margin-left: 1px;
    }
    @keyframes as-pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes as-blink { 50% { opacity: 0; } }


    .as-ground {
        margin-top: 10px; border: 1px solid #eef2f8; border-radius: 12px;
        background: #fbfcff; overflow: hidden;
    }
    .as-ground summary {
        cursor: pointer; padding: 9px 12px; font-size: 11.5px; color: #475569;
        list-style: none;
    }
    .as-ground summary::-webkit-details-marker { display: none; }
    .as-ground summary::after { content: '＋'; float: right; color: #94a3b8; }
    .as-ground[open] summary::after { content: '−'; }
    .as-ground-list { padding: 0 12px 10px; display: grid; gap: 8px; }
    .as-ground-item { border-left: 2px solid #10b981; padding-left: 9px; }
    .as-ground-item.infer { border-left-color: #f59e0b; }
    .as-ground-item p { margin: 0 0 4px; font-size: 11.5px; line-height: 1.65; color: #334155; }
    .as-srcs { display: flex; flex-wrap: wrap; gap: 5px; }
    .as-src {
        font-size: 10.5px; color: #047857; background: #ecfdf5;
        border: 1px solid #d1fae5; border-radius: 999px; padding: 1px 7px;
    }
    .as-src.infer { color: #b45309; background: #fffbeb; border-color: #fef3c7; }

    .as-artifacts { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
    .as-artifact {
        display: flex; align-items: center; gap: 9px; padding: 9px 11px;
        border: 1px solid #e0e7ff; border-radius: 11px; background: #f8faff;
        text-decoration: none; transition: .16s;
    }
    .as-artifact:hover { border-color: #c7d2fe; background: #eef2ff; }
    .as-artifact-icon { color: #4f46e5; display: grid; place-items: center; }
    .as-artifact-meta { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
    .as-artifact-meta b { font-size: 12px; color: #1e293b; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
    .as-artifact-meta i { font-style: normal; font-size: 10.5px; color: #94a3b8; }
    .as-artifact-dl { margin-left: auto; font-size: 11.5px; color: #4f46e5; font-weight: 600; }


    .as-sessions {
        margin: 10px 16px 0; border: 1px solid #e6ebf3; border-radius: 12px;
        background: #fbfcff; max-height: 220px; overflow-y: auto;
    }
    .as-sessions-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 12px; border-bottom: 1px solid #eef2f8; font-size: 12px;
        color: #475569; font-weight: 600;
    }
    .as-new-session {
        border: 0; background: #eef2ff; color: #4338ca; border-radius: 8px;
        font-size: 11.5px; padding: 4px 9px; cursor: pointer; font-family: inherit;
    }
    .as-session-item {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        font-size: 12px; color: #475569; cursor: pointer; border-bottom: 1px solid #f4f7fc;
    }
    .as-session-item:hover { background: #f2f6ff; }
    .as-session-item.active { background: #eef2ff; color: #4338ca; font-weight: 600; }
    .as-session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .as-session-del {
        border: 0; background: transparent; color: #cbd5e1; cursor: pointer;
        font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .as-session-del:hover { color: #ef4444; }
    .as-session-meta { font-size: 10.5px; color: #94a3b8; }

    @media (max-width: 720px) {
        .as-panel { width: 100vw; }
        .as-toggle { right: 16px; bottom: 18px; }
    }
</style>

<button class="as-toggle" id="asToggle" title="AI 助手" aria-label="打开 AI 助手">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 16.3l-2.1 2.1"/>
    </svg>
</button>

<aside class="as-panel" id="asPanel" aria-label="AI 助手">
    <div class="as-head">
        <div class="as-avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 16.3l-2.1 2.1"/>
            </svg>
        </div>
        <div>
            <div class="as-name">AI 助手</div>
            <div class="as-sub">每条结论都能溯源</div>
        </div>
        <button class="as-close" id="asSessionsBtn" title="会话" aria-label="会话"
                style="margin-left:auto;margin-right:4px;font-size:13px;">☰</button>
        <button class="as-close" id="asClose" aria-label="收起">&times;</button>
    </div>

    <div class="as-sessions" id="asSessionsPanel" style="display:none;">
        <div class="as-sessions-head">
            <span>会话</span>
            <button type="button" class="as-new-session" id="asNewSession">＋ 新建</button>
        </div>
        <div class="as-session-list" id="asSessionList"></div>
    </div>

    <div class="as-ctx" id="asCtx">
        <span class="dot"></span>
        <span id="asCtxText">当前没有进行预测，可以问我系统怎么用</span>
    </div>

    <div class="as-quick" id="asQuick">
        <button class="as-chip" data-q="解释这次预测结果">解释这次判断</button>
        <button class="as-chip" data-q="这次和上次比，差异在哪">和上次比</button>
        <button class="as-chip" data-q="这类病例一共多少条">同类病例多少</button>
        <button class="as-chip" data-q="怎么填写这些特征">怎么填特征</button>
    </div>

    <div class="as-body" id="asBody">
        <div class="as-msg">
            <div class="as-bubble">
                <p>我是这个系统的助手。每个回答都会给出依据，证据不够时我会直接说不够。</p>
                <p>你可以让我解释这次结果、和上次对比，或者查一下数据。</p>
            </div>
        </div>
    </div>

    <div class="as-foot">
        <div class="as-input-row">
            <textarea class="as-input" id="asInput" rows="1"
                      placeholder="问点什么，比如：为什么判为恶性？"></textarea>
            <button class="as-send" id="asSend" aria-label="发送">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
            </button>
        </div>
        <div class="as-tools">
            <span id="asHint">Enter 发送 · Shift+Enter 换行</span>
            <button id="asExport" type="button">导出对话</button>
        </div>
    </div>
</aside>

<script>
(function () {
    var panel = document.getElementById('asPanel');
    var toggle = document.getElementById('asToggle');
    var close = document.getElementById('asClose');
    var body = document.getElementById('asBody');
    var input = document.getElementById('asInput');
    var send = document.getElementById('asSend');
    var ctxText = document.getElementById('asCtxText');
    var exportBtn = document.getElementById('asExport');

    if (!panel || !body) { return; }

    var history = [];
    var recentArtifacts = [];
    var busy = false;
    var context = window.AGENT_CONTEXT || {};
    var lastAnswer = '';

    function openPanel() {
        panel.classList.add('open');
        toggle.classList.add('hidden');
        setTimeout(function () { input.focus(); }, 260);
    }
    function closePanel() {
        panel.classList.remove('open');
        toggle.classList.remove('hidden');
    }

    toggle.addEventListener('click', openPanel);
    close.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && panel.classList.contains('open')) { closePanel(); }
    });

    function renderContext() {
        if (!ctxText) { return; }
        if (context.recordId) {
            var bits = ['记录 #' + context.recordId];
            if (context.prediction) { bits.push(context.prediction); }
            if (context.confidence) { bits.push('置信度 ' + Number(context.confidence).toFixed(3)); }
            if (context.tier) { bits.push(context.tier === 'confident' ? '证据充分'
                : context.tier === 'cautious' ? '证据一般' : '证据不足'); }
            ctxText.innerHTML = '<b>' + bits.join(' · ') + '</b>';
        } else {
            ctxText.textContent = '当前没有进行预测，可以问我系统怎么用';
        }
    }
    renderContext();

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, function (ch) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
    }

    function renderMarkdown(text) {
        var lines = escapeHtml(text || '').split('\n');
        var html = '', inList = false;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (/^[-*]\s+/.test(line)) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += '<li>' + line.replace(/^[-*]\s+/, '') + '</li>';
                continue;
            }
            if (inList) { html += '</ul>'; inList = false; }
            if (!line) { continue; }
            html += '<p>' + line + '</p>';
        }
        if (inList) { html += '</ul>'; }
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        return html;
    }

    function addUser(text) {
        var row = document.createElement('div');
        row.className = 'as-msg user';
        row.innerHTML = '<div class="as-bubble">' + escapeHtml(text) + '</div>';
        body.appendChild(row);
        body.scrollTop = body.scrollHeight;
    }

    function addLoading() {
        var row = document.createElement('div');
        row.className = 'as-msg';
        row.id = 'asLoading';
        row.innerHTML = '<div class="as-bubble"><span class="as-dots"><span></span><span></span><span></span></span></div>';
        body.appendChild(row);
        body.scrollTop = body.scrollHeight;
    }

    function removeLoading() {
        var node = document.getElementById('asLoading');
        if (node) { node.remove(); }
    }

    function renderArtifacts(bubble, artifacts, runId) {
        if (!artifacts || !artifacts.length) { return; }
        var box = document.createElement('div');
        box.className = 'as-artifacts';
        artifacts.forEach(function (a) {
            var card = document.createElement('a');
            card.className = 'as-artifact';
            card.href = '/api/agent/artifact/' + encodeURIComponent(runId || '') +
                        '/' + encodeURIComponent(a.filename || '');
            card.setAttribute('download', a.filename || '');
            var kb = a.size ? Math.round(a.size / 1024) + ' KB' : '';
            card.innerHTML = '<span class="as-artifact-icon">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>' +
                '<path d="M14 3v5h5"/></svg></span>' +
                '<span class="as-artifact-meta"><b>' + escapeHtml(a.filename || '报告') + '</b>' +
                '<i>' + escapeHtml((a.kind || 'pdf').toUpperCase()) + (kb ? ' · ' + kb : '') + '</i></span>' +
                '<span class="as-artifact-dl">下载</span>';
            box.appendChild(card);
        });
        bubble.appendChild(box);
    }

    function newBubble() {
        var row = document.createElement('div');
        row.className = 'as-msg';
        var bubble = document.createElement('div');
        bubble.className = 'as-bubble';
        row.appendChild(bubble);
        body.appendChild(row);
        body.scrollTop = body.scrollHeight;
        return bubble;
    }

    function addTimeline(bubble) {
        var tl = document.createElement('div');
        tl.className = 'as-timeline';
        bubble.appendChild(tl);
        return tl;
    }

    function timelineItem(tl, label, meta) {
        var item = document.createElement('div');
        item.className = 'as-tl-item running';
        item.innerHTML = '<span class="as-tl-dot"></span>' +
                         '<span class="as-tl-label">' + escapeHtml(label) + '</span>' +
                         '<span class="as-tl-meta">' + escapeHtml(meta || '') + '</span>';
        tl.appendChild(item);
        body.scrollTop = body.scrollHeight;
        return item;
    }

    function markItem(item, ok, meta) {
        item.classList.remove('running');
        item.classList.add(ok ? 'done' : 'fail');
        var metaEl = item.querySelector('.as-tl-meta');
        if (metaEl) { metaEl.textContent = meta || ''; }
    }


    function renderGrounding(bubble, g) {
        if (!g || !(g.claims || []).length) { return; }
        var claims = g.claims || [];
        var okCount = claims.filter(function (c) { return c.supported; }).length;
        var det = document.createElement('details');
        det.className = 'as-ground';
        var summary = document.createElement('summary');
        summary.innerHTML = '逐句溯源 · <b>' + okCount + '/' + claims.length + '</b> 句有出处' +
            (g.dropped_count ? ' · 已丢弃 ' + g.dropped_count + ' 句无依据内容' : '');
        det.appendChild(summary);

        var list = document.createElement('div');
        list.className = 'as-ground-list';
        claims.forEach(function (c) {
            var row = document.createElement('div');
            row.className = 'as-ground-item ' + (c.supported ? 'ok' : 'infer');
            var srcs = (c.sources || []).map(function (s) {
                return '<span class="as-src">' + escapeHtml(s.label) + '</span>';
            }).join('');
            if (!srcs) {
                srcs = '<span class="as-src infer">无出处 · 推断</span>';
            }
            row.innerHTML = '<p>' + escapeHtml((c.sentence || '').slice(0, 90)) + '</p>' +
                            '<div class="as-srcs">' + srcs + '</div>';
            list.appendChild(row);
        });
        det.appendChild(list);
        bubble.appendChild(det);
    }

    function renderStepsFallback(bubble, result) {
        var steps = result.graph || [];
        if (!steps.length && (result.steps || []).length) {
            steps = result.steps.map(function (st) {
                return { node: st.label || st.tool || 'step', verdict: st.verdict || 'ok' };
            });
        }
        if (!steps.length) { return; }
        var det = document.createElement('details');
        det.className = 'as-steps';
        var summary = document.createElement('summary');
        summary.textContent = '处理过程（' + steps.length + ' 步）';
        det.appendChild(summary);
        var ol = document.createElement('ol');
        steps.forEach(function (step) {
            var li = document.createElement('li');
            var verdict = step.verdict && step.verdict !== 'ok' ? ' · ' + step.verdict : '';
            li.innerHTML = '<b>' + escapeHtml(step.node || 'step') + '</b>' + escapeHtml(verdict);
            ol.appendChild(li);
        });
        det.appendChild(ol);
        bubble.appendChild(det);
    }

    function addAssistant(result) {
        removeLoading();
        var answer = result.answer_md || '（没有拿到回答）';
        lastAnswer = answer;
        var bubble = newBubble();
        bubble.innerHTML = renderMarkdown(answer);
        renderArtifacts(bubble, result.artifacts, result.run_id);
        renderGrounding(bubble, result.grounding);

        if (result.intent === 'report_export' && !(result.artifacts || []).length) {
            var retry = document.createElement('button');
            retry.className = 'as-chip as-retry';
            retry.type = 'button';
            retry.textContent = '重试';
            retry.addEventListener('click', function () { ask(result.question || '生成报告'); });
            bubble.appendChild(retry);
        }

        renderStepsFallback(bubble, result);
        history.push({ question: result.question || '', intent: result.intent || '' });
        if (history.length > 8) { history = history.slice(-8); }
    }

    function syncFallback(payload, done) {
        removeLoading();
        fetch('/api/agent/run-sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function (resp) {
            return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
        }).then(function (res) {
            if (!res.ok || !res.data.ok) {
                throw new Error((res.data && res.data.error) || '请求失败');
            }
            addAssistant(res.data.result || {});
        }).catch(function (err) {
            var bubble = newBubble();
            bubble.textContent = '出错了：' + (err.message || err);
        }).then(done);
    }

    function streamAsk(payload, done) {
        fetch('/api/agent/llm/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function (resp) {
            if (resp.status === 503) { syncFallback(payload, done); return null; }
            if (!resp.ok || !resp.body) { throw new Error('流式接口不可用'); }

            removeLoading();
            var bubble = newBubble();
            var tl = addTimeline(bubble);
            var answerEl = document.createElement('div');
            answerEl.className = 'as-bubble-text as-cursor';
            bubble.appendChild(answerEl);

            var pending = {};
            var answerText = '';
            var reader = resp.body.getReader();
            var decoder = new TextDecoder('utf-8');
            var buffer = '';

            function handle(event, data) {
                if (event === 'thinking') {
                    pending.think = timelineItem(tl, '思考中', '第 ' + (data.step || 1) + ' 步');
                } else if (event === 'tool_call') {
                    var label = (data.tool || '').replace(/_/g, ' ');
                    pending.tool = timelineItem(tl, '调用 ' + label, JSON.stringify(data.args || {}).slice(0, 40));
                    if (pending.think) { markItem(pending.think, true, ''); pending.think = null; }
                } else if (event === 'sub_steps') {
                    (data.steps || []).forEach(function (sub) {
                        var row = document.createElement('div');
                        row.className = 'as-tl-item as-tl-sub ' + (sub.ok ? 'done' : 'fail');
                        row.innerHTML = '<span class="as-tl-dot"></span>' +
                            '<span class="as-tl-label">子代理 · ' + escapeHtml(sub.label || sub.tool) + '</span>' +
                            '<span class="as-tl-meta">' + (sub.latency_ms || 0) + ' ms</span>';
                        tl.appendChild(row);
                    });
                } else if (event === 'tool_result') {
                    if (pending.tool) {
                        markItem(pending.tool, !!data.ok,
                                 (data.ok ? '完成' : '失败') + ' · ' + (data.latency_ms || 0) + ' ms');
                        pending.tool = null;
                    }
                } else if (event === 'token') {
                    answerText += (data.delta || '');
                    answerEl.textContent = answerText;
                    body.scrollTop = body.scrollHeight;
                } else if (event === 'done') {
                    if (pending.think) { markItem(pending.think, true, ''); }
                    if (pending.tool) { markItem(pending.tool, true, ''); }
                    answerEl.classList.remove('as-cursor');
                    var finalText = data.answer_md || answerText;
                    answerEl.innerHTML = renderMarkdown(finalText);
                    lastAnswer = finalText;
                    renderArtifacts(bubble, data.artifacts, data.run_id);
                    renderGrounding(bubble, data.grounding);
                    (data.artifacts || []).forEach(function (a) {
                        recentArtifacts.unshift({ filename: a.filename, kind: a.kind,
                                                  size: a.size, run_id: data.run_id });
                    });
                    recentArtifacts = recentArtifacts.slice(0, 5);
                    history.push({ question: payload.question || '', intent: 'llm',
                                   answer: (answerText || '').slice(0, 200) });
                    if (history.length > 6) { history = history.slice(-6); }
                } else if (event === 'error') {
                    answerEl.classList.remove('as-cursor');
                    answerEl.textContent = '出错了：' + ((data && data.message) || '未知错误');
                } else if (event === 'fallback') {
                    answerEl.classList.remove('as-cursor');
                }
            }

            function pump() {
                return reader.read().then(function (chunk) {
                    if (chunk.done) {
                        if (!answerText) { syncFallback(payload, done); }
                        else { done(); }
                        return;
                    }
                    buffer += decoder.decode(chunk.value, { stream: true });
                    var parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    parts.forEach(function (block) {
                        var event = 'message', dataLine = '';
                        block.split('\n').forEach(function (line) {
                            if (line.indexOf('event:') === 0) { event = line.slice(6).trim(); }
                            else if (line.indexOf('data:') === 0) { dataLine += line.slice(5).trim(); }
                        });
                        if (!dataLine) { return; }
                        var data = {};
                        try { data = JSON.parse(dataLine); } catch (e) { data = {}; }
                        handle(event, data);
                    });
                    return pump();
                });
            }
            return pump();
        }).catch(function (err) {
            syncFallback(payload, done);
        });
    }

    function ask(question) {
        if (busy || !question) { return; }
        var done2 = function () { busy = false; send.disabled = false; input.focus(); };
        busy = true;
        send.disabled = true;
        addUser(question);
        addLoading();

        var payload = {
            question: question,
            values: (window.getAgentValues && window.getAgentValues()) || context.values || null,
            history: history.slice(-6),
            context: { record_id: context.recordId || null },
            recent_artifacts: recentArtifacts.slice(0, 3),
            session_id: currentSession
        };

        if (!currentSession) {
            newSession().then(function () {
                payload.session_id = currentSession;   // 会话是刚建的，必须回填
                streamAsk(payload, done2);
            });
            return;
        }
        streamAsk(payload, function () {
            busy = false;
            send.disabled = false;
            input.focus();
        });
    }

    send.addEventListener('click', function () {
        var text = input.value.trim();
        if (!text) { return; }
        input.value = '';
        ask(text);
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send.click();
        }
    });

    input.addEventListener('input', function () {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    });

    document.querySelectorAll('.as-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            var q = chip.getAttribute('data-q');
            if (q) { openPanel(); ask(q); }
        });
    });

    if (exportBtn) {
        exportBtn.addEventListener('click', function () {
            if (!lastAnswer) { return; }
            var blob = new Blob([lastAnswer], { type: 'text/markdown;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ai-answer-' + Date.now() + '.md';
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        });
    }


    // ---------------- 会话管理 ----------------
    var currentSession = null;
    var sessionsPanel = document.getElementById('asSessionsPanel');
    var sessionsBtn = document.getElementById('asSessionsBtn');
    var sessionList = document.getElementById('asSessionList');
    var newSessionBtn = document.getElementById('asNewSession');

    function renderSessions(items) {
        if (!sessionList) { return; }
        sessionList.innerHTML = '';
        (items || []).forEach(function (item) {
            var row = document.createElement('div');
            row.className = 'as-session-item' + (item.id === currentSession ? ' active' : '');
            row.innerHTML = '<span class="as-session-title">' + escapeHtml(item.title || '未命名') +
                            '</span><span class="as-session-meta">' + (item.messages || 0) + '</span>';
            var del = document.createElement('button');
            del.className = 'as-session-del';
            del.type = 'button';
            del.textContent = '×';
            del.title = '删除会话';
            del.addEventListener('click', function (ev) {
                ev.stopPropagation();
                if (!confirm('删除这个会话？')) { return; }
                fetch('/api/agent/sessions/' + encodeURIComponent(item.id), { method: 'DELETE' })
                    .then(function () {
                        if (currentSession === item.id) { currentSession = null; clearChat(); }
                    


    loadSessions();
                    });
            });
            row.appendChild(del);
            row.addEventListener('click', function () { openSession(item.id); });
            sessionList.appendChild(row);
        });
        if (!(items || []).length) {
            sessionList.innerHTML = '<div class="as-session-item"><span class="as-session-title">还没有会话</span></div>';
        }
    }

    function loadSessions() {
        fetch('/api/agent/sessions').then(function (r) { return r.json(); })
            .then(function (data) { renderSessions((data && data.sessions) || []); })
            .catch(function () {});
    }

    function clearChat() {
        body.innerHTML = '';
        history = [];
        recentArtifacts = [];
    }

    function renderMessage(msg) {
        if (msg.role === 'user') {
            addUser(msg.content || '');
            return;
        }
        var bubble = newBubble();
        bubble.innerHTML = renderMarkdown(msg.content || '');
        var meta = msg.meta || {};
        renderArtifacts(bubble, meta.artifacts || [], meta.run_id || '');
    }

    function openSession(sid) {
        currentSession = sid;
        loadSessions();
        fetch('/api/agent/sessions/' + encodeURIComponent(sid) + '/messages')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                clearChat();
                (data.messages || []).forEach(renderMessage);
                body.scrollTop = body.scrollHeight;
            });
    }

    function newSession() {
        return fetch('/api/agent/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: '新会话' })
        }).then(function (r) { return r.json(); }).then(function (data) {
            currentSession = (data && data.session && data.session.id) || null;
            clearChat();
            loadSessions();
            return currentSession;
        });
    }

    if (sessionsBtn) {
        sessionsBtn.addEventListener('click', function () {
            var open = sessionsPanel.style.display !== 'none';
            sessionsPanel.style.display = open ? 'none' : 'block';
            if (!open) { loadSessions(); refreshAgentContext(); }
        });
    }
    if (newSessionBtn) { newSessionBtn.addEventListener('click', function () { newSession(); }); }
    loadSessions();

    function refreshAgentContext() {
        var has = false;
        try {
            has = !!(window.getAgentValues && window.getAgentValues());
        } catch (e) { has = false; }
        var text = document.getElementById('asCtxText');
        if (text) {
            text.textContent = has
                ? '已读取本次预测的 30 项特征，可以直接问「解释这次判断」'
                : '当前没有进行预测，可以问我系统怎么用';
        }
        var chip = document.querySelector('.as-chip[data-q="解释这次预测结果"]');
        if (chip) { chip.style.display = has ? '' : 'none'; }
    }
    window.refreshAgentContext = refreshAgentContext;
    document.addEventListener('DOMContentLoaded', refreshAgentContext);
    document.addEventListener('input', function () { refreshAgentContext(); });

    window.ASAssistant = { open: openPanel, close: closePanel, ask: ask,
                           setContext: function (ctx) { context = ctx || {}; renderContext(); } };
})();
</script>
